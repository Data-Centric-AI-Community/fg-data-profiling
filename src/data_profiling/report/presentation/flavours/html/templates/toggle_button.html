{% if anchor_id != 'toggle-correlation-description' %}
    <div class="col-sm-12 text-end">
        <button class="btn btn-light toggle-details-button"
                data-bs-toggle="collapse"
                data-bs-target="#bottom-{{ anchor_id }}, #minifreqtable{{ anchor_id }}"
                aria-expanded="false"
                aria-controls="bottom-{{ anchor_id }} minifreqtable{{ anchor_id }}">
            <span class="more-details">{{ text }}</span>
            <span class="less-details">Less details</span>
            <span class="details-arrow" aria-hidden="true"></span>
        </button>
    </div>
{% else %}
    <button id="{{ anchor_id }}"
            class="btn btn-light"
            style="float: right"
            data-bs-toggle="collapse">
        {{ text }}
    </button>
{% endif %}
