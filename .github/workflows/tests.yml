name: Multi-software test

on:
  pull_request:
  push:
    branches:
    - master
    - develop

# A new push to the same PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  YDATA_PROFILING_NO_ANALYTICS: false

jobs:
  # Pull requests test the oldest and newest supported Python.
  # Pushes to develop/master test every supported version.
  test:
    name: Tests | Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.10", "3.14"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install
      run: |
        pip install --upgrade pip "setuptools<81" wheel
        pip install -e ".[test,notebook]" "pandas>1.1" "numpy>=1.21"

    - run: make test

  # Runs once, on a Python version the test matrix above does not cover on PRs.
  coverage:
    name: Coverage
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install
      run: |
        pip install --upgrade pip "setuptools<81" wheel
        pip install -e ".[test,notebook]" "pandas>1.1" "numpy>=1.21"

    - run: make test_cov

    - run: codecov -F py3.13-ubuntu-22.04

  # Pull requests test the oldest and newest PySpark line.
  # Pushes to develop/master test the full matrix.
  test_spark:
    name: Tests Spark | Python ${{ matrix.python-version }} | PySpark ${{ matrix.pyspark-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"python-version":"3.10","pyspark-version":"3.5"},{"python-version":"3.12","pyspark-version":"4.0"}]' || '[{"python-version":"3.10","pyspark-version":"3.5"},{"python-version":"3.11","pyspark-version":"3.5"},{"python-version":"3.10","pyspark-version":"4.0"},{"python-version":"3.11","pyspark-version":"4.0"},{"python-version":"3.12","pyspark-version":"4.0"}]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -U pip "setuptools<81" wheel
          pip install -e ".[test]" "pyspark~=${{ matrix.pyspark-version }}" "pyarrow>4.0.0"
          # Make PySpark use this Python and bind locally; give it a safe tmp dir
          echo "PYSPARK_PYTHON=$(which python)" >> $GITHUB_ENV
          echo "PYSPARK_DRIVER_PYTHON=$(which python)" >> $GITHUB_ENV
          echo "SPARK_LOCAL_IP=127.0.0.1" >> $GITHUB_ENV
          echo "SPARK_LOCAL_DIRS=$RUNNER_TEMP/spark-tmp" >> $GITHUB_ENV
          mkdir -p "$RUNNER_TEMP/spark-tmp"

      - run: make test_spark
